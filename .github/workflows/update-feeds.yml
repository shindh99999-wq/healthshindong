name: 콘텐츠 자동 업데이트

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 한국시간 오전 6시 17분
  workflow_dispatch:         # Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 사진 줄이기 도구 설치
        run: pip install pillow
      - name: 유튜브·블로그 최신 글 반영
        run: python scripts/update_feeds.py
      - name: 바뀐 내용이 있으면 저장
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "feed-bot"
            git config user.email "feed-bot@users.noreply.github.com"
            git add -A content back knee images/blog sitemap.xml
            git commit -m "콘텐츠 자동 업데이트"
            git push
          fi
